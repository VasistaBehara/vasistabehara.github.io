<footer>
    <div class="container">
        <div class="social-links" style="margin-bottom: 20px;">
            {% if site.data.resume.basics.email %}
            <a href="mailto:{{ site.data.resume.basics.email }}" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            {% endif %}
            {% for profile in site.data.resume.basics.profiles %}
            <a href="{{ profile.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ profile.network }}">
                <i class="fab fa-{{ profile.network | downcase }}"></i>
            </a>
            {% endfor %}
        </div>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.data.resume.basics.name }}. Built with Jekyll.</p>
    </div>
</footer>
