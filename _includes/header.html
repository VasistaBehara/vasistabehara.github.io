        style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <a href="{{ " /" | relative_url }}" style="font-weight: 700; color: #fff; font-size: 1.2rem;">
            {{ site.title | truncate: 15 }}

        <nav>
            <ul style="display: flex; gap: 20px; list-style: none; margin: 0;">
                <li><a href="#about">About</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#skills">Skills</a></li>
