<section id="skills" class="section">
    <div class="container">
        <h2 class="section-title">Technical Skills</h2>

        <div class="skills-grid">
            {% for category in site.data.resume.skills %}
            <div class="skill-category">
                <h3>{{ category.name }}</h3>
                <div class="tags">
                    {% for keyword in category.keywords %}
                    <span>{{ keyword }}</span>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
