summary: |
  5+ years of experience as a DevOps & Cloud Engineer, delivering secure, scalable, and cost-optimized infrastructure across AWS and GCP environments. Designed and provisioned infrastructure using CloudFormation and Terraform, supporting high availability. Built/managed CI/CD pipelines (GitLab, GitHub Actions) for Python, Node.js, and Flutter apps. Skilled in containerization (Docker, Kubernetes/EKS/GKE, Helm), serverless (Lambda), and observability (Prometheus, Grafana, ELK). committed to security (IAM, KMS, Cloud Armor) and cost optimization.

work:
  - company: Citywide Automation
    position: DevOps Engineer
    startDate: "2021-04-01"
    endDate: Current
    location: GTA, Canada
    summary: |
      Designed and provisioned AWS infrastructure (EC2, VPC, EKS, RDS, etc.) using CloudFormation. Deployed Docker microservices to EKS with Helm. Managed frontend deployments (S3+CloudFront) and automated pipelines with self-hosted GitLab CI. Implemented security controls (IAM, Secrets Manager, KMS) and optimized costs (Spot Instances, Savings Plans).
    highlights:
      - Designed and provisioned AWS cloud infrastructure using CloudFormation (EC2, VPC, IAM, RDS, S3, CloudFront, EKS, NLB).
      - Deployed Docker-based microservices to Kubernetes (EKS) using Helm charts; ensured HA and auto-scaling.
      - Exposed K8s workloads via NLBs integrated with API Gateway.
      - Managed DNS via Route 53 and GoDaddy.
      - Deployed Flutter frontend on S3 + CloudFront.
      - Developed self-hosted GitLab CI/CD pipelines.
      - Managed container lifecycle with ECR.
      - Monitored health using CloudWatch and self-hosted ELK stack.
      - Implemented security (IAM, Secrets Manager, KMS, firewall rules).
      - Configured networking (TCP/IP, VPC peering, VPNs).
      - Set up JIRA and Confluence for agile tracking.
      - Optimized AWS spend using Savings Plans and Spot Instances.
      - Utilized Cognito for auth and SES for emails.
      - Developed serverless Python Lambda functions for automation.

  - company: Behara Consulting Inc (Owner)
    position: Freelance Cloud Engineer
    startDate: "2020-03-01"
    endDate: Current
    location: GTA, Canada
    summary: |
      Designed and provisioned GCP infrastructure with Terraform. Built CI/CD workflows with GitHub Actions. Managed containerized apps on GKE and App Engine. Maintained SOC 2 compliance and implemented security best practices.
    highlights:
      - Designed GCP infrastructure using Terraform and GitHub Actions.
      - Built CI/CD workflows with GitHub Actions.
      - Deployed apps on GKE and App Engine to Docker/K8s.
      - Managed Cloud SQL, Redis, BigQuery, Firebase.
      - Deployed mono-repo apps (Node.js, Flutter) in GKE Autopilot.
      - Implemented IAM, Cloud Armor, VPC Service Controls.
      - Maintained SOC 2 compliance using Security Command Center.
      - Configured Prometheus, Grafana, GCP Monitoring/Logging.
      - Set up proactive alerting and incident response.
      - Managed DNS (Cloud DNS, GoDaddy) and secure VPCs.
      - Enabled CDN and IAP for secure delivery.
      - Supported devs with WireMock, Mailpit, Lens.
      - Used Cloud Run with functions for web apps.

