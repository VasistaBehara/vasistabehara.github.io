title: "Vasista Avinash Behara"
name: "Vasista Avinash Behara"
description: "DevOps / Cloud Engineer portfolio"
url: "https://vasistabehara.github.io"
baseurl: ""
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "dark"
locale: en-US
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

include:
  - _pages

author:
  name: "Vasista Avinash Behara"
  bio: "DevOps / Cloud Engineer focused on resilient automation across AWS and GCP."
  location: "Ontario, Canada"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/vasistabehara"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/vasistabehara"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:contact@placeholder.dev"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      toc: true
      toc_label: "On this page"
      toc_icon: "list"
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

header_pages:
  - _pages/about.md
  - _pages/projects.md
  - _pages/resume.md
  - _pages/contact.md

social:
  type: Person
  name: "Vasista Avinash Behara"
  links:
    - "https://github.com/vasistabehara"
    - "https://www.linkedin.com/in/vasistabehara"
